<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08040a">
<title>Selah — Pause, Reflect, Discern</title>
<meta name="description" content="A multi-faith spiritual sanctuary for journaling, discernment, and reflection.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<style>
/* ============ SELAH DESIGN SYSTEM — Galaxy Celestial (single-theme dark commit) ============ */
:root{
  --bg:#08040a;
  --bg-deep:#050208;
  --primary:#ad2bee;
  --teal:#2beee3;
  --gold:#ffd700;
  --ink:#ffffff;
  --ink-70:rgba(255,255,255,.7);
  --ink-50:rgba(255,255,255,.5);
  --ink-40:rgba(255,255,255,.4);
  --ink-30:rgba(255,255,255,.3);
  --glass:rgba(255,255,255,.04);
  --glass-border:rgba(255,255,255,.1);
  --danger:#ff5d7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(173,43,238,.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 40%, rgba(43,238,227,.09) 0%, transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(173,43,238,.08) 0%, transparent 50%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
body:not(.icons-ready) .material-symbols-outlined{opacity:0}
.material-symbols-outlined{transition:opacity .2s;
  font-family:'Material Symbols Outlined';
  font-weight:normal;font-style:normal;font-size:24px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
  word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
.ms-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.star-field{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle, #ffffff .6px, transparent .6px);
  background-size:60px 60px;opacity:.12;
}
#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh}
.screen{display:none;min-height:100dvh;padding-bottom:150px;animation:fadein .35s ease}
.screen.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.calm *{animation:none!important;transition:none!important}

/* glass + buttons */
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border)}
.grad{background:linear-gradient(90deg,var(--primary) 0%,var(--teal) 100%)}
.grad-btn{
  background:linear-gradient(90deg,var(--primary) 0%,var(--teal) 100%);
  border:none;color:#fff;font-family:inherit;font-weight:700;cursor:pointer;
  border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s ease;width:100%;padding:16px;
  font-size:13px;text-transform:uppercase;letter-spacing:.15em;
  box-shadow:0 8px 30px rgba(173,43,238,.25);
}
.grad-btn:active{transform:scale(.98)}
.grad-btn:disabled{opacity:.4;cursor:default}
.ghost-btn{
  background:var(--glass);border:1px solid var(--glass-border);color:var(--ink-70);
  font-family:inherit;font-weight:600;cursor:pointer;border-radius:14px;padding:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-size:12px;text-transform:uppercase;letter-spacing:.1em;
}
button{font-family:inherit}
input,textarea,select{
  font-family:inherit;color:var(--ink);background:rgba(255,255,255,.05);
  border:1px solid var(--glass-border);border-radius:14px;padding:14px 16px;
  font-size:15px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:rgba(43,238,227,.45);box-shadow:0 0 0 1px rgba(43,238,227,.2)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.25)}
select{appearance:none;-webkit-appearance:none}
label.field-label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-40);margin-bottom:8px}

/* typographic utilities */
.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-40)}
.tagline{font-size:10px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:#bf8bff;text-shadow:0 0 12px rgba(191,139,255,.6)}
.accent-p{color:var(--primary)}
.accent-t{color:var(--teal)}
h1.screen-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.px{padding-left:22px;padding-right:22px}
.section{margin-bottom:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card{border-radius:24px;padding:20px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:rgba(43,238,227,.1);border:1px solid rgba(43,238,227,.3);color:var(--teal);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
}
.chip.purple{background:rgba(173,43,238,.12);border-color:rgba(173,43,238,.35);color:#cf7bff}
.chip.dim{background:rgba(255,255,255,.05);border-color:var(--glass-border);color:var(--ink-50)}

/* header */
.app-header{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(8,4,10,.7);border-bottom:1px solid rgba(255,255,255,.05);
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 16px rgba(173,43,238,.45)}
.brand .b-title{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand .b-sub{font-size:8px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-40);margin-top:4px}
.avatar-btn{
  width:38px;height:38px;border-radius:50%;cursor:pointer;border:1px solid rgba(173,43,238,.45);
  background:linear-gradient(135deg,rgba(173,43,238,.3),rgba(43,238,227,.25));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;box-shadow:0 0 14px rgba(173,43,238,.3);
}

/* bottom nav */
#bottom-nav{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;
  width:min(92%,396px);height:76px;border-radius:999px;
  background:rgba(7,4,10,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:space-around;padding:0 10px;
}
#bottom-nav.visible{display:flex}
.nav-btn{
  background:none;border:none;cursor:pointer;color:var(--ink-30);
  display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:6px 0;
}
.nav-btn span.lbl{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.nav-btn.on{color:var(--teal)}
.nav-btn.on .material-symbols-outlined{filter:drop-shadow(0 0 8px rgba(43,238,227,.5))}
.fab{
  width:62px;height:62px;border-radius:50%;border:5px solid var(--bg-deep);cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--teal));color:#fff;
  display:flex;align-items:center;justify-content:center;margin-top:-46px;
  box-shadow:0 0 30px rgba(173,43,238,.5);transition:transform .15s ease;
}
.fab:active{transform:scale(.92)}

/* auth */
.auth-wrap{display:flex;flex-direction:column;align-items:center;padding:56px 30px 40px;min-height:100dvh}
.auth-logo{width:150px;height:150px;border-radius:50%;box-shadow:0 0 60px rgba(124,58,237,.4);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.auth-name{font-size:52px;font-weight:700;letter-spacing:-.02em;margin-top:26px}
.auth-name .lah{background:linear-gradient(90deg,#fff,#a78bfa,#7c3aed);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.method-toggle{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:16px;padding:5px;width:100%;margin-bottom:16px}
.method-toggle button{
  flex:1;background:none;border:none;border-radius:12px;color:var(--ink-40);cursor:pointer;
  padding:11px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.method-toggle button.on{background:rgba(173,43,238,.2);border:1px solid rgba(173,43,238,.35);color:#fff}
.field-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:18px;padding:14px 20px;width:100%}
.field-card input{background:none;border:none;padding:6px 0 0;font-size:16px;box-shadow:none}
.field-card input:focus{box-shadow:none}
.otp-row{display:flex;gap:10px;justify-content:center;margin:18px 0}
.otp-row input{width:48px;height:58px;text-align:center;font-size:24px;font-weight:700;padding:0}
.demo-note{
  margin-top:16px;border-radius:14px;padding:12px 16px;width:100%;
  background:rgba(43,238,227,.07);border:1px dashed rgba(43,238,227,.35);
  font-size:12px;color:var(--ink-70);line-height:1.5;
}
.demo-note b{color:var(--teal);letter-spacing:.1em}

/* onboarding */
.ob-progress{display:flex;gap:6px;margin:20px 0 26px}
.ob-progress i{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.1)}
.ob-progress i.done{background:linear-gradient(90deg,var(--primary),var(--teal))}
.opt-card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:15px 16px;
  color:var(--ink-70);font-size:14px;font-weight:500;margin-bottom:10px;transition:border-color .15s;
}
.opt-card .material-symbols-outlined{color:var(--ink-40);font-size:22px}
.opt-card.on{border-color:var(--teal);background:rgba(43,238,227,.08);color:#fff;box-shadow:0 0 14px rgba(43,238,227,.18)}
.opt-card.on .material-symbols-outlined{color:var(--teal)}
.opt-card small{display:block;font-size:11px;color:var(--ink-40);font-weight:400;margin-top:2px}
.comfort-row{margin-bottom:20px}
.comfort-row .cr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.comfort-row .cr-name{font-size:13px;font-weight:600}
.comfort-row .cr-val{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--teal)}
.dots{display:flex;gap:8px}
.dots button{
  flex:1;height:34px;border-radius:10px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);color:var(--ink-40);font-weight:700;cursor:pointer;font-size:13px;
}
.dots button.on{background:linear-gradient(135deg,rgba(173,43,238,.4),rgba(43,238,227,.3));border-color:rgba(43,238,227,.5);color:#fff}

/* emotions + clairs */
.emo-row{display:flex;justify-content:space-between;background:rgba(255,255,255,.02);border:1px solid var(--glass-border);border-radius:32px;padding:14px}
.emo{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink-30)}
.emo .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center}
.emo span.lbl{font-size:9px;text-transform:uppercase;letter-spacing:-.02em}
.emo.on{color:var(--primary)}
.emo.on .ic{background:rgba(173,43,238,.2);border-color:rgba(173,43,238,.45);box-shadow:0 0 18px rgba(173,43,238,.4);color:var(--primary)}
.clair-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px;background:rgba(255,255,255,.01);border:1px solid var(--glass-border);border-radius:24px;padding:18px 12px}
.clair{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink-50)}
.clair .ic{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center}
.clair span.lbl{font-size:8px;text-transform:uppercase;text-align:center;line-height:1.15;letter-spacing:-.02em;opacity:.65}
.clair.on{color:var(--teal)}
.clair.on .ic{border-color:var(--teal);background:rgba(43,238,227,.1);box-shadow:0 0 14px rgba(43,238,227,.4)}
.clair.on span.lbl{opacity:1;font-weight:700}

/* journal */
.jr-textarea{min-height:170px;resize:vertical;font-size:16px;line-height:1.6;font-weight:300;border-radius:20px}
.jr-wrap{position:relative}
.jr-wrap .jr-textarea{position:relative;z-index:1;display:block}
.jr-backdrop{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
  padding:14px 16px;border:1px solid transparent;border-radius:20px;
  font-family:inherit;font-size:16px;line-height:1.6;font-weight:300;
  white-space:pre-wrap;word-wrap:break-word;color:transparent}
.jr-backdrop .hl{color:transparent;font-weight:inherit;padding:0;border-radius:5px;
  background:rgba(43,238,227,.16);box-shadow:0 0 16px rgba(43,238,227,.45);
  animation:hlGlow 1.1s ease}
@keyframes hlGlow{0%{background:rgba(43,238,227,.02);box-shadow:0 0 2px rgba(43,238,227,.05)}55%{background:rgba(43,238,227,.28);box-shadow:0 0 26px rgba(43,238,227,.75)}100%{background:rgba(43,238,227,.16);box-shadow:0 0 16px rgba(43,238,227,.45)}}
.jr-tools{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:3}
.jr-tools .icon-mini{background:rgba(10,8,20,.72);backdrop-filter:blur(6px)}
.sym-found{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hl{color:var(--teal);background:rgba(43,238,227,.1);padding:0 4px;border-radius:4px;font-weight:600}
.insight-card{background:linear-gradient(135deg,rgba(173,43,238,.12),rgba(43,238,227,.06));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;font-size:14px;line-height:1.65;color:rgba(255,255,255,.9)}
.sq-item{display:flex;gap:14px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.05);align-items:flex-start}
.sq-item:last-child{border-bottom:none}
.sq-item .num{color:var(--primary);font-weight:700;font-size:13px}
.sq-item p{font-size:13px;color:var(--ink-70);line-height:1.5}
.crisis-card{background:rgba(255,93,122,.08);border:1px solid rgba(255,93,122,.35);border-radius:18px;padding:18px;line-height:1.6;font-size:13px}
.crisis-card b{color:#ff8fa3}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:none;border-radius:10px;color:var(--ink-40);cursor:pointer;padding:9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:rgba(173,43,238,.22);color:#fff;border:1px solid rgba(173,43,238,.35)}

/* streak + charts */
.streak-row{display:flex;justify-content:space-between}
.streak-day{display:flex;flex-direction:column;align-items:center;gap:8px}
.streak-day .d{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--ink-40)}
.streak-day .n{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.1);color:var(--ink-30)}
.streak-day.hit .n{background:linear-gradient(135deg,var(--primary),var(--teal));border:none;color:#fff;box-shadow:0 0 12px rgba(43,238,227,.4)}
.bars{display:flex;align-items:flex-end;gap:9px;height:120px;margin-top:16px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--teal),var(--primary));min-height:3px;opacity:.85}
.bar-col .d{font-size:8px;color:var(--ink-30);text-transform:uppercase;font-weight:700}

/* moments list */
.moment-card{border-radius:22px;padding:18px;margin-bottom:14px}
.moment-card .m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.moment-card .m-text{font-size:14px;line-height:1.6;color:var(--ink-70);font-weight:300}
.icon-mini{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);
  color:var(--ink-50);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}

/* library */
.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.05);cursor:pointer;
  border:1px solid rgba(255,255,255,.08);color:var(--ink-50);font-size:11px;font-weight:700;
}
.pill.on{border-color:rgba(173,43,238,.6);background:rgba(173,43,238,.2);color:#fff;box-shadow:0 4px 14px rgba(173,43,238,.2)}
.lib-card{border-radius:24px;overflow:hidden;margin-bottom:18px}
.lib-hero{height:96px;position:relative;display:flex;align-items:flex-end;padding:14px 18px}
.lib-hero .glyph{position:absolute;right:16px;top:12px;font-size:44px;opacity:.35;color:var(--teal)}
.lib-body{display:grid;grid-template-columns:1fr 1fr}
.lib-body>div{padding:14px}
.lib-body h4{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;margin-bottom:7px}
.lib-body p,.lib-body textarea{font-size:11px;line-height:1.55;color:var(--ink-70)}
.lib-body textarea{background:none;border:none;padding:0;resize:none;min-height:56px;font-style:italic;border-radius:0}
.lib-body textarea:focus{box-shadow:none}

/* moon */
.moon-vis{width:74px;height:74px;border-radius:50%;position:relative;overflow:hidden;background:#1c1c22;box-shadow:inset -4px -4px 12px rgba(0,0,0,.8), 0 0 20px rgba(255,255,255,.08)}
.moon-lit{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%, #e8e8ee 0%, #b9b9c4 70%, #9a9aa6 100%)}

/* keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 30px;max-width:280px;margin:0 auto}
.key{
  width:74px;height:74px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);
  color:rgba(248,250,252,.9);font-size:26px;font-weight:300;cursor:pointer;margin:0 auto;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.key:active{border-color:rgba(15,221,240,.6);box-shadow:0 0 20px rgba(15,221,240,.25)}
.pin-dots{display:flex;gap:22px;justify-content:center;margin:26px 0 34px}
.pin-dots i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.pin-dots i.fill{background:var(--teal);border:none;box-shadow:0 0 12px var(--teal)}

/* modal */
.modal-veil{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 50%, rgba(173,43,238,.22) 0%, rgba(8,4,10,.94) 100%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modal-veil.open{display:flex}
.modal-card{width:100%;max-width:370px;border-radius:34px;padding:28px;background:rgba(24,14,30,.85);border:1px solid rgba(173,43,238,.35);box-shadow:0 8px 40px rgba(0,0,0,.6);max-height:88dvh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--ink-30);cursor:pointer}
.price-opt{display:flex;justify-content:space-between;align-items:center;padding:18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer;margin-bottom:12px;position:relative}
.price-opt.on{border:2px solid rgba(173,43,238,.6)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.price-opt.on .radio{border-color:var(--primary)}
.price-opt.on .radio::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--primary)}
.save-badge{position:absolute;top:-10px;right:14px;background:var(--teal);color:var(--bg-deep);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:99px}

/* pulse */
.pulse-card{border-radius:28px;padding:20px;margin-bottom:16px}
.pulse-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.pulse-ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,rgba(173,43,238,.5),rgba(43,238,227,.4));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:2px solid rgba(255,255,255,.12)}
.sym-circle{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)}
.earth-spin{position:absolute;inset:0;border-radius:50%;background-size:380px 190px;background-repeat:repeat-x;background-position:8px center;animation:earthSpin 48s linear infinite}
@keyframes earthSpin{from{background-position-x:8px}to{background-position-x:-372px}}

/* petition/victory cards */
.masonry{column-count:2;column-gap:12px}
.masonry-item{break-inside:avoid;margin-bottom:12px}
.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:300;
  background:rgba(20,12,26,.95);border:1px solid rgba(43,238,227,.4);border-radius:14px;
  padding:12px 20px;font-size:13px;font-weight:500;color:#fff;display:none;max-width:88%;
  box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center;
}
.toast.show{display:block;animation:fadein .3s ease}
.serif-quote{font-family:'Noto Serif',serif;font-style:italic;font-size:20px;line-height:1.55;text-align:center}
.divider-dot{width:32px;height:1px;background:rgba(255,255,255,.2);margin:14px auto}
.hidden{display:none!important}
a{color:var(--teal)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

function orderRow(id, arr, labelFn){
  if(!Array.isArray(arr) || arr.length < 2) return '';
  return `<div style="margin-top:10px">
    <span class="eyebrow" style="font-size:8px;color:var(--ink-40)">Prefer an order? Drag to rearrange · optional</span>
    <div id="${id}" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
      ${arr.map((v,i)=>`<span class="chip order-chip" draggable="true" data-i="${i}" style="cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none"><span class="material-symbols-outlined" style="font-size:12px">drag_indicator</span>${esc(labelFn ? labelFn(v) : v)}</span>`).join('')}
    </div></div>`;
}
function wireOrderRow(id, arr, after){
  const row = document.getElementById(id); if(!row) return;
  const move = (from, to)=>{ if(from===to || from==null || to==null) return; const [m]=arr.splice(from,1); arr.splice(to,0,m); after(); };
  row.querySelectorAll('.order-chip').forEach(ch=>{
    ch.addEventListener('dragstart', e=>{ row._drag = +ch.dataset.i; try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); }catch(_e){} });
    ch.addEventListener('dragover', e=>e.preventDefault());
    ch.addEventListener('drop', e=>{ e.preventDefault(); move(row._drag, +ch.dataset.i); row._drag = null; });
    ch.addEventListener('touchstart', ()=>{ row._drag = +ch.dataset.i; ch.style.opacity = .55; }, {passive:true});
    ch.addEventListener('touchmove', e=>{ e.preventDefault(); }, {passive:false});
    ch.addEventListener('touchend', e=>{
      ch.style.opacity = '';
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest('.order-chip');
      if(target && target.parentElement === row) move(row._drag, +target.dataset.i);
      row._drag = null;
    });
  });
}

let GQ = null;
function startGiftQuiz(target){
  GQ = { i:0, scores:{}, target: target || 'profile' };
  renderGiftQuiz();
}
function renderGiftQuiz(){
  const total = GIFT_QUIZ.length;
  if(GQ.i < total){
    const item = GIFT_QUIZ[GQ.i];
    openModal(`
      <span class="eyebrow" style="color:var(--teal)">Discovering your gifts \u00b7 ${GQ.i+1} of ${total}</span>
      <h2 style="font-size:17px;font-weight:600;margin:12px 0 6px;line-height:1.55">${item.q}</h2>
      <p style="font-size:11px;color:var(--ink-40);margin-bottom:16px">There are no wrong answers. Go with your first instinct.</p>
      <button class="opt-card" onclick="answerGiftQuiz(2)"><span class="material-symbols-outlined">check_circle</span>Often, yes</button>
      <button class="opt-card" onclick="answerGiftQuiz(1)"><span class="material-symbols-outlined">contrast</span>Sometimes</button>
      <button class="opt-card" onclick="answerGiftQuiz(0)"><span class="material-symbols-outlined">circle</span>Not really</button>
      <button style="background:none;border:none;color:var(--ink-40);margin-top:12px;cursor:pointer;font-size:12px;width:100%" onclick="closeModal()">Finish later</button>
    `);
    return;
  }
  GQ.strong = GIFT_QUIZ.filter(x=>GQ.scores[x.k]===2).map(x=>x.k);
  GQ.some = GIFT_QUIZ.filter(x=>GQ.scores[x.k]===1).map(x=>x.k);
  GQ.picked = GQ.strong.slice();
  renderGiftQuizResults();
}
function answerGiftQuiz(v){ GQ.scores[GIFT_QUIZ[GQ.i].k] = v; GQ.i++; renderGiftQuiz(); }
function renderGiftQuizResults(){
  const qLens = (GQ.target==='ob' && !S.onboarded && typeof obPrimaryLens==='function') ? obPrimaryLens() : undefined;
  const card = (k, note)=>{
    const on = GQ.picked.includes(k);
    const info = CLAIR_INFO[k];
    const icon = (CLAIRS.find(c=>c.k===k)||{}).icon || 'auto_awesome';
    return `<button class="opt-card ${on?'on':''}" onclick="toggleQuizPick('${k.replace(/'/g,"\\'")}')"><span class="material-symbols-outlined">${icon}</span><span style="flex:1">${giftLabel(k, qLens)}<small>${note}${info?' \u00b7 '+info.desc:''}</small></span></button>`;
  };
  if(!GQ.strong.length && !GQ.some.length){
    openModal(`
      <h2 style="font-size:20px;font-weight:700;margin-bottom:6px">Nothing Has to Be Decided Today</h2>
      <p style="font-size:13px;color:var(--ink-50);line-height:1.7;margin-bottom:18px">That is completely okay — many people discover how insight reaches them slowly, through living and journaling. Keep writing your moments, and patterns will start to show themselves. You can retake this or choose gifts by hand anytime from your profile.</p>
      <button class="grad-btn" onclick="closeModal();render()">Sounds Good</button>
    `);
    return;
  }
  openModal(`
    <h2 style="font-size:20px;font-weight:700;margin-bottom:6px">What Resonated</h2>
    <p style="font-size:12px;color:var(--ink-50);margin-bottom:16px;line-height:1.6">Based on your answers, these may be how insight reaches you — named in your own tradition\u2019s language. You decide: tap to keep or remove any of them.</p>
    ${GQ.strong.map(k=>card(k,'Resonated strongly')).join('')}
    ${GQ.some.map(k=>card(k,'Sometimes resonates')).join('')}
    <button class="grad-btn" style="margin-top:14px" onclick="applyGiftQuiz()">Keep the Selected Ones</button>
  `);
}
function toggleQuizPick(k){
  const i = GQ.picked.indexOf(k);
  if(i>-1) GQ.picked.splice(i,1); else GQ.picked.push(k);
  renderGiftQuizResults();
}
function applyGiftQuiz(){
  if(GQ.target==='ob' && typeof OB !== 'undefined' && !S.onboarded){
    GQ.picked.forEach(k=>{ if(!OB.gifts.includes(k)) OB.gifts.push(k); });
  } else {
    S.user.gifts = S.user.gifts || [];
    GQ.picked.forEach(k=>{ if(!S.user.gifts.includes(k)) S.user.gifts.push(k); });
    save();
  }
  const n = GQ.picked.length;
  GQ = null;
  closeModal(); render();
  if(n) toast('Added. Your gifts are yours to refine anytime.');
}

/* ---------- moon phase ---------- */
function moonPhase(d){
  const synodic = 29.53058867;
  const known = Date.UTC(2000,0,6,18,14)/86400000; // known new moon
  const days = d.getTime()/86400000 - known;
  const age = ((days % synodic) + synodic) % synodic;
  const frac = age / synodic;
  let name, hint;
  if(frac < 0.033 || frac > 0.967){ name='New Moon'; hint='New beginnings, planting intention'; }
  else if(frac < 0.216){ name='Waxing Crescent'; hint='Momentum, first steps'; }
  else if(frac < 0.284){ name='First Quarter'; hint='Decision, commitment'; }
  else if(frac < 0.466){ name='Waxing Gibbous'; hint='Refinement, ideal for growth'; }
  else if(frac < 0.534){ name='Full Moon'; hint='Illumination, release, gratitude'; }
  else if(frac < 0.716){ name='Waning Gibbous'; hint='Harvest, giving thanks'; }
  else if(frac < 0.784){ name='Last Quarter'; hint='Release, forgiveness'; }
  else { name='Waning Crescent'; hint='Rest, surrender, deep listening'; }
  const daysToNew = Math.ceil(synodic - age) % 30;
  return {name, hint, frac, age, daysToNew};
}

function LT(t){
  if(S.lang!=='es' || !t) return t;
  const m = String(t).match(/^(\s*)([\s\S]*?)(\s*)$/);
  const core = m[2];
  if(ES[core]) return m[1] + ES[core] + m[3];
  for(const [rx, rp] of ES_RX){ if(rx.test(core)) return m[1] + core.replace(rx, rp) + m[3]; }
  return t;

  if(S.lang!=='es' || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const el = n.parentElement;
      if(!el || el.closest('.material-symbols-outlined') || el.closest('script,style')) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ const t = LT(n.nodeValue); if(t !== n.nodeValue) n.nodeValue = t; });
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(a=>{
      const v = el.getAttribute(a); if(v){ const t = LT(v); if(t!==v) el.setAttribute(a, t); }
    });
  });
}

/* ---------- helpers ---------- */
function esc(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function toast(msg, ms){ const t=document.getElementById('toast'); t.innerHTML=LT(msg); t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms||2600); }
function initialOf(){ return (S.user.soulName||'S').trim().charAt(0).toUpperCase(); }
function markStreak(){ const k=todayKey(); if(!S.streak.includes(k)){ S.streak.push(k); } }
function streakCount(){
  let c=0; const d=new Date();
  if(!S.streak.includes(todayKey(d))) d.setDate(d.getDate()-1);
  while(S.streak.includes(todayKey(d))){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function detectSymbols(text){
  const found=[]; const lower=' '+text.toLowerCase()+' ';
  const check=(token,key)=>{
    const re = /^[\d:]+$/.test(token) ? new RegExp('(^|\\D)'+token.replace(':','\\:')+'(\\D|$)') : new RegExp('\\b'+token+'\\b');
    if(re.test(lower) && !found.includes(key)) found.push(key);
  };
  Object.keys(SYMBOLS).forEach(k=>check(k.toLowerCase(),k));
  Object.keys(SYM_ALIASES).forEach(a=>check(a, SYM_ALIASES[a]));
  const SUBSUMED = {'oak':'tree','ocean':'water','river':'water','storm':'rain','garden':'tree'};
  Object.entries(SUBSUMED).forEach(([spec,gen])=>{ if(found.includes(spec) && found.includes(gen)) found.splice(found.indexOf(gen),1); });
  return found;
}
function highlightText(text, syms){
  let safe = esc(text);
  const tokens = new Set();
  syms.forEach(k=>{ tokens.add(k); Object.keys(SYM_ALIASES).forEach(a=>{ if(SYM_ALIASES[a]===k) tokens.add(a); }); });
  tokens.forEach(tok=>{
    const re = /^[\d:]+$/.test(tok) ? new RegExp('('+tok.replace(':','\\:')+')','g') : new RegExp('\\b('+tok+')\\b','gi');
    safe = safe.replace(re, '<span class="hl">$1</span>');
  });
  return safe;
}

function generateDiscernment(m){
  const dnl = divineList();
  const dn = dnl[Math.floor(Math.random()*dnl.length)];
  const name = S.user.soulName || 'Friend';
  const season = S.user.season ? seasonLabel(S.user.season) : null;
  const symNames = m.symbols.map(k=>SYMBOLS[k].name);
  const parts = [];
  if(m.type==='dream'){
    parts.push(`${name}, dreams speak in a grammar older than words.`);
  } else {
    parts.push(`${name}, thank you for pausing long enough to notice.`);
  }
  if(symNames.length===1){
    parts.push(`The ${symNames[0].toLowerCase()} stands out here. ${SYMBOLS[m.symbols[0]].meaning}`);
  } else if(symNames.length>1){
    const first=m.symbols[0], second=m.symbols[1];
    parts.push(`Two threads are weaving together: the ${SYMBOLS[first].name.toLowerCase()} and the ${SYMBOLS[second].name.toLowerCase()}. ${SYMBOLS[first].meaning} Held beside that, the ${SYMBOLS[second].name.toLowerCase()} speaks of this: ${SYMBOLS[second].meaning.charAt(0).toLowerCase()+SYMBOLS[second].meaning.slice(1)}`);
  } else {
    parts.push(`No classic symbols surfaced this time, and that matters too. Sometimes the message is the feeling itself, delivered without costume.`);
  }
  if(m.emotion==='Awe') parts.push(`The awe you felt is not decoration. It is data. Something in you recognized something true.`);
  if(m.emotion==='Anxiety') parts.push(`Notice the anxiety without obeying it. Fear and calling often arrive in the same envelope.`);
  if(m.emotion==='Sadness') parts.push(`The sadness deserves a seat at the table, not a verdict. Grief is love with nowhere obvious to go.`);
  if(m.emotion==='Peace') parts.push(`That peace is worth memorizing. Let your body learn its address so you can find your way back.`);
  if(m.emotion==='Joy') parts.push(`Joy like this is not frivolous. It is evidence.`);
  if(m.clairs.length){
    const g = m.clairs[0];
    parts.push(`You sensed this through ${giftLabel(g)}. That channel keeps showing up for you. Trust it a little more each time.`);
  }
  if(season) parts.push(`All of this lands inside ${season}, the season you named, and that colors everything. Be patient with the timeline.`);
  parts.push(`Selah. Sit with it before you rush to interpret. ${dn} is not in a hurry, and neither is the truth.`);
  const questions = [];
  const qPool = [
    m.symbols[0] ? `If the ${SYMBOLS[m.symbols[0]].name.toLowerCase()} could speak one sentence to you, what would it say?` : `What is the one sentence this moment is trying to say to you?`,
    m.emotion ? `Where in your body did the ${m.emotion.toLowerCase()} live, and what does that place usually protect?` : `What did your body know before your mind caught up?`,
    season ? `How does this land differently because you are in ${season} right now?` : `What would change if you trusted this was meant for you?`,
    `What small, concrete act would honor this message within the next day?`
  ];
  for(const q of qPool){ if(questions.length<3) questions.push(q); }
  return { reflection: parts.join(' '), questions };
}

function wireAuth(){
  const send = document.getElementById('send-btn');
  if(send){
    const input = document.getElementById('contact-input');
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') send.click(); });
    send.onclick = async ()=>{
      const v = input.value.trim();
      if(authMethod==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ toast('That email address needs another look.'); return; }
      if(authMethod==='phone' && v.replace(/\D/g,'').length < 7){ toast('That phone number looks too short.'); return; }
      authContact = v;
      if(window.BK && BK.on){
        send.disabled = true; send.textContent = 'Sending your code…';
        try{
          await BK.sendOtp(authMethod, v);
          authCode = null; authStage = 'code'; render();
        }catch(e){
          send.disabled = false; render();
          toast(BK.friendly(e, 'The code could not be sent. Check the address and try again.'));
        }
        return;
      }
      authCode = String(Math.floor(100000 + Math.random()*900000));
      authStage = 'code';
      render();
    };
  }
  const otp = document.getElementById('otp');
  if(otp){
    const inputs = [...otp.querySelectorAll('input')];
    inputs[0].focus();
    inputs.forEach((inp,i)=>{
      inp.addEventListener('input', ()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,1); if(inp.value && i<5) inputs[i+1].focus(); });
      inp.addEventListener('keydown', e=>{ if(e.key==='Backspace' && !inp.value && i>0) inputs[i-1].focus(); });
      inp.addEventListener('paste', e=>{ e.preventDefault(); const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); t.split('').forEach((c,j)=>{ if(inputs[j]) inputs[j].value=c; }); if(t.length===6) inputs[5].focus(); });
    });
    const vbtn = document.getElementById('verify-btn');
    vbtn.onclick = async ()=>{
      const entered = inputs.map(x=>x.value).join('');
      if(entered.length < 6){ toast('Enter all six digits of your code.'); return; }
      if(window.BK && BK.on){
        vbtn.disabled = true;
        try{
          await BK.verifyOtp(authMethod, authContact, entered);
          S.auth = {method:authMethod, contact:authContact, at:new Date().toISOString()};
          await BK.pullState();
          save(); render();
        }catch(e){
          vbtn.disabled = false;
          toast(BK.friendly(e, 'That code does not match, or it expired. Request a fresh one.'));
        }
        return;
      }
      if(entered !== authCode){ toast('That code does not match. Check the one shown below.'); return; }
      S.auth = {method:authMethod, contact:authContact, at:new Date().toISOString()};
      save(); render();
    };
  }
}

        <div class="comfort-row">
          <div class="cr-head"><span class="cr-name"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;color:var(--ink-40)">${icon}</span> ${name}</span><span class="cr-val" id="cv-${k}">${u.comfort[k]}/5</span></div>
          <div class="dots" data-k="${k}">${[1,2,3,4,5].map(n=>`<button class="${u.comfort[k]>=n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
        </div>`).join('')}
    `, true);
  }
  if(obStep===3){
    const lens = obPrimaryLens();
    return obShell(`
      <h1 class="screen-title" style="margin-bottom:6px">How insight reaches you</h1>
      <p style="color:var(--ink-50);font-size:14px;line-height:1.6;margin-bottom:14px">People sense things in different ways. Choose every one that resonates; skip any that do not. Each card explains what it means.</p>
      <button class="ghost-btn" style="width:100%;padding:14px;margin-bottom:16px;font-size:13px" onclick="startGiftQuiz('ob')"><span class="material-symbols-outlined" style="font-size:18px">explore</span>Not Sure Yet? Take a Short Discovery Quiz</button>

    `, true, u.gifts.length? 'Continue' : 'Skip for now');
  }
  if(obStep===4){
    return obShell(`
      <h1 class="screen-title" style="margin-bottom:6px">Who walks with you?</h1>
      <p style="color:var(--ink-50);font-size:14px;line-height:1.6;margin-bottom:20px">Choose any that fit — most people are a mix.</p>
      <div id="ob-rel">
        <button class="opt-card ${u.relational.includes('Solitary')?'on':''}" data-v="Solitary"><span class="material-symbols-outlined">person</span>Time on my own<small>Some of my practice is mine alone</small></button>
        <button class="opt-card ${u.relational.includes('Small Circle')?'on':''}" data-v="Small Circle"><span class="material-symbols-outlined">group</span>A few trusted people<small>A small circle walks with me</small></button>
        <button class="opt-card ${u.relational.includes('Community')?'on':''}" data-v="Community"><span class="material-symbols-outlined">groups</span>A community<small>I draw strength from the group</small></button>
      </div>
    `, u.relational.length>0);
  }
  if(obStep===5){
    const lens = obPrimaryLens();
    return obShell(`
      <h1 class="screen-title" style="margin-bottom:6px">Your current season</h1>
      <p style="color:var(--ink-50);font-size:14px;line-height:1.6;margin-bottom:20px">Where does this chapter of your life find you?</p>
      <div id="ob-season">${SEASONS.map(s=>{const lbl=SEASONS_MAP[s][lens]||s;return `<button class="opt-card ${u.season===s?'on':''}" data-v="${s}"><span class="material-symbols-outlined">partly_cloudy_night</span>${lbl}${lbl!==s?`<small>${s}</small>`:''}</button>`;}).join('')}</div>
    `, !!u.season);
  }
  return obShell(`
    <h1 class="screen-title" style="margin-bottom:6px">How do you process?</h1>
    <p style="color:var(--ink-50);font-size:14px;line-height:1.6;margin-bottom:20px">Choose every way that works for you.</p>
    <div id="ob-proc">
      ${[['Writing','edit_note','Words on the page untangle me'],['Speaking','mic','I think out loud'],['Visual','palette','Images before words'],['Stillness','self_improvement','Silence does the work']].map(([k,icon,sub])=>`
      <button class="opt-card ${OB.processing.includes(k)?'on':''}" data-v="${k}"><span class="material-symbols-outlined">${icon}</span>${k}<small>${sub}</small></button>`).join('')}
    </div>
  `, OB.processing.length>0, 'Finish and come in');
}
function wireOnboarding(){
  const next = document.getElementById('ob-next');
  const bindText = (id, set)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', ()=>set(el.value)); };
  bindText('ob-name', v=>{ OB.soulName=v; next.disabled=!v.trim(); });
  bindText('ob-divine-custom', v=>{ OB.divineCustom=v; });
  bindText('ob-lens-custom', v=>{ OB.customLens=v; if(v.trim()) next.disabled=false; else next.disabled = OB.lenses.length===0; });
  bindText('ob-book-custom', v=>{ OB.holyBookCustom=v; });
  const bookSel = document.getElementById('ob-book');
  if(bookSel) bookSel.addEventListener('change', ()=>{ OB.holyBook=bookSel.value; });
  const pickOne = (id, set)=>{ const el=document.getElementById(id); if(!el) return;
    el.querySelectorAll('.opt-card').forEach(b=>b.onclick=()=>{ set(b.dataset.v); render(); }); };
  pickOne('ob-season', v=>OB.season=v);
  const pickMany = (id, arr)=>{ const el=document.getElementById(id); if(!el) return;
    el.querySelectorAll('.opt-card').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v; const i=arr.indexOf(v);
      if(i>-1) arr.splice(i,1); else arr.push(v);
      render();
    }); };
  pickMany('ob-divine', OB.divineNames);
  pickMany('ob-pron', OB.divinePronouns);
  pickMany('ob-lens', OB.lenses);
  wireOrderRow('ord-divine', OB.divineNames, ()=>render());
  wireOrderRow('ord-pron', OB.divinePronouns, ()=>render());
  wireOrderRow('ord-lens', OB.lenses, ()=>render());
  pickMany('ob-rel', OB.relational);
  pickMany('ob-gifts', OB.gifts);
  pickMany('ob-proc', OB.processing);
  const exp = document.getElementById('ob-explorer');
  if(exp) exp.onclick = ()=>{ OB.explorer=!OB.explorer; render(); };
  document.querySelectorAll('.dots').forEach(row=>{
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      OB.comfort[row.dataset.k] = +b.dataset.n; render();
    });
  });
  if(next) next.onclick = ()=>{
    if(next.disabled) return;
    if(obStep < 6){ obStep++; render(); return; }
    S.user = {...S.user,
      soulName: OB.soulName.trim(),
      divineNames: (()=>{ const a = OB.divineNames.slice(); const c = OB.divineCustom.trim(); if(c && !a.includes(c)) a.push(c); return a.length ? a : ['The Divine']; })(),
      divinePronouns: OB.divinePronouns.length ? OB.divinePronouns.slice() : ['none'],
      divineName: OB.divineNames[0] || OB.divineCustom.trim() || 'The Divine',
      divinePronoun: OB.divinePronouns[0] || 'none',
      lens: obPrimaryLens(),
      lenses: OB.lenses.length ? OB.lenses.slice() : ['Universal'],
      customLens: OB.customLens.trim(),
      holyBook: OB.holyBook, holyBookCustom: OB.holyBookCustom.trim(),
      explorer: OB.explorer, comfort: OB.comfort, gifts: OB.gifts.slice(),
      relational: OB.relational.slice(), season: OB.season, processing: OB.processing.slice()
    };
    S.onboarded = true; markStreak(); save();
    route='home'; render();
    setTimeout(()=>toast(`Welcome, ${esc(S.user.soulName)}. It is all set up for you.`), 400);
  };
}
</script>
<script>
/* ================= HOME ================= */
function clairFreq(){
  const days = {}; const now = new Date();
  const counts = [];
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); counts.push({key:todayKey(d), label:d.toLocaleDateString(undefined,{weekday:'narrow'}), n:0}); }
  S.moments.forEach(m=>{ const k=todayKey(new Date(m.createdAt)); const c=counts.find(x=>x.key===k); if(c) c.n += 1 + m.clairs.length; });
  return counts;
}
function topClair(){
  const tally={};
  S.moments.forEach(m=>m.clairs.forEach(c=>tally[c]=(tally[c]||0)+1));
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return top ? top[0] : null;
}
function alignScore(){
  const week = clairFreq().reduce((a,c)=>a+c.n,0);
  return Math.min(98, 40 + week*6 + streakCount()*3);
}
function viewHome(){
  const hour = new Date().getHours();
  const greet = hour<5?'Up early, or up late?':hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  const week = (()=>{ const out=[]; const now=new Date();
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i);
      out.push({label:d.toLocaleDateString(undefined,{weekday:'narrow'}), num:d.getDate(), hit:S.streak.includes(todayKey(d))}); }

  const last = S.moments.filter(m=>!m.vault)[0];
  const tc = topClair();
  const freq = clairFreq(); const maxN = Math.max(1,...freq.map(f=>f.n));
  const victories = S.petitions.filter(p=>p.answered).length;
  const active = S.petitions.filter(p=>!p.answered).length;
  const txt = dailyText();
  const align = alignScore();
  return appHeader('Selah','Home') + `<main class="px" style="padding-top:20px">
    <div class="section">
      <p class="eyebrow" style="margin-bottom:4px">${greet}</p>
      <h1 style="font-size:26px;font-weight:700">${esc(S.user.soulName)}</h1>
      ${S.user.season?`<span class="chip purple" style="margin-top:10px">${esc(seasonLabel(S.user.season))}</span>`:''}
    </div>

    <section class="section glass card" style="border-radius:32px">
      <div class="section-head" style="margin-bottom:18px">
        <span style="font-size:14px;font-weight:700">Your <span class="accent-p">Streak</span></span>
        <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700">${(n=>n>0? n+(n===1?' Day':' Days'):'Begins Today')(streakCount())} <span class="material-symbols-outlined accent-p" style="font-size:16px">local_fire_department</span></span>
      </div>
      <div class="streak-row">${week.map(w=>`<div class="streak-day ${w.hit?'hit':''}"><span class="d">${w.label}</span><span class="n">${w.num}</span></div>`).join('')}</div>
    </section>

    <section class="section">
      <button class="grad-btn" style="height:62px;font-size:16px;text-transform:none;letter-spacing:.02em" onclick="go('journal')">
        <span class="material-symbols-outlined" style="font-size:24px">flare</span> Begin a Selah Moment
      </button>
    </section>

    <section class="section glass card" style="border-radius:32px;border-color:rgba(173,43,238,.25)">
      <div class="section-head">
        <div><div style="font-size:14px;font-weight:700;margin-bottom:6px">Your Clarity</div>
        <span class="chip"><i style="width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)"></i>${align>75?'In a strong rhythm':align>55?'Finding your rhythm':'Easing back in'}</span></div>
        <div style="text-align:right;cursor:pointer" onclick="openClarityInfo()"><div style="font-size:26px;font-weight:700">${align}%</div><div class="eyebrow" style="font-size:8px">Clarity level <span class="material-symbols-outlined" style="font-size:11px;vertical-align:-2px">info</span></div></div>
      </div>
      <div class="bars">${freq.map(f=>`<div class="bar-col"><div class="bar" style="height:${Math.round(f.n/maxN*100)}%;${f.n===0?'opacity:.15':''}"></div><span class="d">${f.label}</span></div>`).join('')}</div>
      ${tc?`<div style="margin-top:14px;display:flex;align-items:center;gap:8px"><span class="chip">Top gift</span><span style="font-size:12px;color:var(--ink-70)">${esc(giftLabel(tc))}</span></div>`:''}
    </section>

    ${last?`<section class="section">
      <div class="section-head"><span class="eyebrow">Latest Moment</span><button class="icon-mini" onclick="go('moments')" aria-label="All moments"><span class="material-symbols-outlined" style="font-size:17px">arrow_forward</span></button></div>
      <div class="glass card" style="border-radius:28px;border-color:rgba(43,238,227,.2)">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <div style="width:42px;height:42px;border-radius:14px;background:rgba(43,238,227,.1);border:1px solid rgba(43,238,227,.3);display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined accent-t">${last.type==='dream'?'bedtime':'flare'}</span></div>
          <div><div style="font-size:14px;font-weight:700">${last.type==='dream'?'Dream Log':'Waking Moment'}</div><div style="font-size:10px;color:rgba(43,238,227,.7);font-weight:600;text-transform:uppercase;letter-spacing:.08em">${fmtDate(last.createdAt)}</div></div>
        </div>
        <p style="font-size:14px;line-height:1.65;color:var(--ink-70);font-style:italic">"${highlightText(last.text.slice(0,220), last.symbols)}${last.text.length>220?'…':''}"</p>
        ${last.symbols.length?`<div class="sym-found" style="margin-top:14px">${last.symbols.map(s=>`<span class="chip purple"><span class="material-symbols-outlined" style="font-size:12px">auto_fix_high</span>${esc(SYMBOLS[s].name)}</span>`).join('')}</div>`:''}
      </div>
    </section>`:''}

    <section class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <button class="glass card" style="border-radius:26px;text-align:left;cursor:pointer;border-color:rgba(43,238,227,.3);background:var(--glass)" onclick="go('victories')">
        <span class="material-symbols-outlined accent-t" style="margin-bottom:10px">verified</span>
        <div class="eyebrow" style="color:rgba(43,238,227,.7);font-size:9px;margin-bottom:4px">${T('wall')}</div>
        <div style="font-size:${victories>0?19:15}px;font-weight:700;color:#fff">${victories>0? victories+' Answered' : 'Your First Awaits'}</div>
      </button>
      <button class="glass card" style="border-radius:26px;text-align:left;cursor:pointer;border-color:rgba(173,43,238,.3);background:var(--glass)" onclick="go('petitions')">
        <span class="material-symbols-outlined accent-p" style="margin-bottom:10px">waving_hand</span>
        <div class="eyebrow" style="color:rgba(173,43,238,.8);font-size:9px;margin-bottom:4px">${T('activeShort')}</div>
        <div style="font-size:${active>0?19:15}px;font-weight:700;color:#fff">${active>0? active+' Active' : 'Start One'}</div>
      </button>
    </section>

    <section class="section">
      <div class="section-head"><span class="eyebrow">Your Logs</span><button class="icon-mini" onclick="go('library')"><span class="material-symbols-outlined" style="font-size:17px">arrow_forward</span></button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <button class="glass card" style="border-radius:26px;text-align:left;cursor:pointer;background:var(--glass)" onclick="go('moments','dream')">
          <div style="width:40px;height:40px;border-radius:12px;background:rgba(173,43,238,.1);border:1px solid rgba(173,43,238,.25);display:flex;align-items:center;justify-content:center;margin-bottom:24px"><span class="material-symbols-outlined accent-p">bedtime</span></div>
          <div style="font-size:14px;font-weight:700;color:#fff">Dream Logs</div>
          <div style="font-size:10px;color:var(--ink-40);margin-top:4px">${(n=>n>0? n+' Logged':'Record Your First')(S.moments.filter(m=>m.type==='dream').length)}</div>
        </button>
        <button class="glass card" style="border-radius:26px;text-align:left;cursor:pointer;background:var(--glass)" onclick="go('moments','waking')">
          <div style="width:40px;height:40px;border-radius:12px;background:rgba(43,238,227,.1);border:1px solid rgba(43,238,227,.25);display:flex;align-items:center;justify-content:center;margin-bottom:24px"><span class="material-symbols-outlined accent-t">eco</span></div>
          <div style="font-size:14px;font-weight:700;color:#fff">Waking Moments</div>
          <div style="font-size:10px;color:var(--ink-40);margin-top:4px">${(n=>n>0? n+' Noticed':'Notice Your First')(S.moments.filter(m=>m.type==='waking').length)}</div>
        </button>
      </div>
    </section>

    <section class="section glass card" style="border-radius:30px;padding:30px;text-align:center;position:relative">
      <span class="material-symbols-outlined" style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:rgba(173,43,238,.5);font-size:30px">flare</span>
      <p class="serif-quote">"${esc(txt[0])}"</p>
      <div class="divider-dot"></div>
      <p class="eyebrow">${esc(txt[1])}</p>
    </section>
  </main>` + navBar('home');
}

/* ================= MOMENTS LIST ================= */
function viewMoments(filter){
  let list = S.moments.filter(m=>!m.vault);
  if(filter==='dream') list = list.filter(m=>m.type==='dream');
  if(filter==='waking') list = list.filter(m=>m.type==='waking');
  return appHeader('Your','Journal') + `<main class="px" style="padding-top:20px">
    <div class="section-head">
      <h1 class="screen-title">${filter==='dream'?'Dream Logs':filter==='waking'?'Waking Moments':'All Moments'}</h1>
      ${S.vaultPin!==null||S.moments.some(m=>m.vault)?`<button class="chip dim" style="cursor:pointer;border:1px solid var(--glass-border);background:rgba(255,255,255,.05)" onclick="go('vault')"><span class="material-symbols-outlined" style="font-size:13px">lock</span>Vault</button>`:''}
    </div>
    ${list.length===0?`<div class="glass card" style="border-radius:24px;text-align:center;padding:40px 24px;color:var(--ink-40);font-size:14px;line-height:1.6">Nothing here yet. Tap the star below to capture your first Selah Moment.</div>`:''}
    ${list.map(m=>momentCard(m)).join('')}
  </main>` + navBar('home');
}
function momentCard(m){
  return `<div class="glass moment-card">
    <div class="m-head">
      <span class="chip ${m.type==='dream'?'purple':''}"><span class="material-symbols-outlined" style="font-size:12px">${m.type==='dream'?'bedtime':'flare'}</span>${m.type==='dream'?'Dream':'Waking'}</span>
      <span style="font-size:10px;color:var(--ink-30);font-weight:600">${fmtDate(m.createdAt)}</span>
    </div>
    <p class="m-text">"${highlightText(m.text, m.symbols)}"</p>
    ${m.emotion||m.clairs.length?`<div class="sym-found">${m.emotion?`<span class="chip dim">${esc(m.emotion)}</span>`:''}${m.clairs.map(c=>`<span class="chip">${esc(giftLabel(c))}</span>`).join('')}</div>`:''}
    ${m.reflection?`<div class="insight-card" style="margin-top:14px;font-size:13px"><div class="eyebrow" style="color:var(--teal);margin-bottom:8px;font-size:9px"><span class="material-symbols-outlined" style="font-size:12px;vertical-align:-2px">auto_fix_high</span> Selah ${T('insight')}</div>${esc(m.reflection)}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button class="icon-mini" title="${m.vault?'Remove from vault':'Move to vault'}" onclick="toggleVault('${m.id}')"><span class="material-symbols-outlined" style="font-size:17px">${m.vault?'lock_open':'lock'}</span></button>
      <button class="icon-mini" title="Delete" onclick="delMoment('${m.id}')"><span class="material-symbols-outlined" style="font-size:17px">delete</span></button>
    </div>
  </div>`;
}
function toggleVault(id){
  const m = S.moments.find(x=>x.id===id); if(!m) return;
  if(!m.vault && S.vaultPin===null){ toast('Set a vault PIN first.'); go('vault'); return; }
  m.vault = !m.vault; save(); render();
  toast(m.vault?'Moved to your private vault.':'Back in your open journal.');
}
function delMoment(id){
  if(!confirmAsk('Delete this entry? It cannot be recovered.')) return;
  S.moments = S.moments.filter(x=>x.id!==id); save(); render();
}
function confirmAsk(msg){ return window.confirm(msg); }

/* ================= JOURNAL CANVAS ================= */
let J = null;
function resetJ(){ J = {type:'waking', emotion:null, clairs:[], text:'', symbols:[], reflection:null, questions:[], photo:null}; }
function viewJournal(){
  if(!J) resetJ();
  return `<header class="app-header">

    <div class="section">

    <div class="section">

      <div class="clair-grid">${CLAIRS.map(c=>`<button class="clair ${J.clairs.includes(c.k)?'on':''}" data-clair="${c.k}"><span class="ic"><span class="material-symbols-outlined" style="font-size:20px">${c.icon}</span></span><span class="lbl">${giftLabel(c.k)}</span></button>`).join('')}</div>
    </div>

    <div class="section">

let dictation = null;
function toggleDictation(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Voice input is not supported in this browser yet. Chrome and Safari work best.'); return; }
  if(dictation){ dictation.stop(); return; }
  const rec = new SR();
  rec.lang = S.lang==='es' ? 'es-US' : 'en-US';
  rec.continuous = true; rec.interimResults = true;
  const base = (document.getElementById('jr-text')||{value:''}).value;
  rec.onresult = (e)=>{
    let finals='', interim='';
    for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finals+=r[0].transcript; else interim+=r[0].transcript; }
    const el = document.getElementById('jr-text'); if(!el) return;
    el.value = (base + (base?' ':'') + finals + interim).replace(/ {2,}/g,' ');
    el.dispatchEvent(new Event('input'));
  };
  rec.onend = ()=>{
    dictation = null;
    const b = document.getElementById('mic-btn');
    if(b){ b.style.background=''; b.style.borderColor=''; const ic=b.querySelector('.material-symbols-outlined'); if(ic) ic.textContent='mic'; }
  };
  rec.onerror = (e)=>{ if(e.error==='not-allowed') toast('Selah needs microphone permission to hear you.'); };
  dictation = rec;
  btn.style.background='rgba(238,43,110,.28)'; btn.style.borderColor='rgba(238,43,110,.6)';
  const ic = btn.querySelector('.material-symbols-outlined'); if(ic) ic.textContent='stop';
  toast('Listening… speak your dream or moment.');
  rec.start();
}
function attachPhoto(file){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    const MAX = 640;
    let w = img.width, h = img.height;
    if(Math.max(w,h) > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    J.photo = c.toDataURL('image/jpeg', 0.72);
    URL.revokeObjectURL(url);
    render();
    toast('Photo added. Selah will look at it with you.');
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast('That image could not be read. Try another one.'); };
  img.src = url;
}
function wireJournal(){
  const ta = document.getElementById('jr-text');
  ta.addEventListener('input', ()=>{
    J.text = ta.value;
    J.symbols = detectSymbols(J.text);
    J.crisis = CRISIS_RE.test(J.text);
    const cnt = document.getElementById('sym-count');
    cnt.style.visibility = J.symbols.length?'visible':'hidden';
    cnt.innerHTML = `<span class="material-symbols-outlined" style="font-size:12px">verified</span>${J.symbols.length} symbol${J.symbols.length===1?'':'s'} found`;
    document.getElementById('sym-chips').innerHTML = J.symbols.map(s=>`<span class="chip"><span class="material-symbols-outlined" style="font-size:12px">${SYMBOLS[s].icon}</span>${esc(SYMBOLS[s].name)}</span>`).join('');
    document.getElementById('crisis-slot').innerHTML = J.crisis?crisisCard():'';
    const glow = document.getElementById('jr-glow');
    if(glow){ glow.innerHTML = highlightText(J.text, J.symbols); glow.scrollTop = ta.scrollTop; }
  });
  ta.addEventListener('scroll', ()=>{ const g = document.getElementById('jr-glow'); if(g) g.scrollTop = ta.scrollTop; });
  const mic = document.getElementById('mic-btn');
  if(mic) mic.onclick = ()=>toggleDictation(mic);
  const cam = document.getElementById('cam-btn');
  const photoInput = document.getElementById('jr-photo-input');
  if(cam && photoInput) cam.onclick = ()=>photoInput.click();
  if(photoInput) photoInput.onchange = ()=>{ const f = photoInput.files && photoInput.files[0]; if(f) attachPhoto(f); };
  document.querySelectorAll('[data-clair]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.clair;
    J.clairs = J.clairs.includes(k) ? J.clairs.filter(x=>x!==k) : [...J.clairs,k];
    render();
  });
  const db = document.getElementById('discern-btn');
  if(db) db.onclick = async ()=>{
    if(!J.text.trim() && !J.photo){ toast('Write or speak your stream first. Selah listens to what you notice.'); return; }
    if(!canDiscern()){ openPaywall(); return; }
    S.discernsToday.count++; save();
    let out = null;
    if(window.BK && BK.on && BK.session){
      db.disabled = true;
      db.innerHTML = '<span class="material-symbols-outlined">psychology</span>Selah is listening…';
      try{ out = await BK.discern(J); }
      catch(e){ console.warn(e); toast('The AI is quiet right now, so a built-in reflection stands in.'); }
    }
    if(!out) out = generateDiscernment(J);
    J.reflection = out.reflection; J.questions = out.questions;
    render(); window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  };
  document.getElementById('save-moment').onclick = ()=>{
    if(!J.text.trim() && !J.photo){ toast('Write a few words or add a photo first.'); return; }
    S.moments.unshift({ id:'m'+Date.now(), type:J.type, text:J.text, emotion:J.emotion,
      clairs:J.clairs, symbols:J.symbols, reflection:J.reflection, questions:J.questions,
      photo:J.photo||null, vault:false, createdAt:new Date().toISOString() });
    markStreak(); save(); resetJ();
    go('home'); toast('Saved. Selah.');
  };
}

function wireLibrary(){

    t.addEventListener('change', ()=>{ S.revelations[t.dataset.rev]=t.value; save(); toast('Revelation kept.'); });
  });
}

function pinPress(n){
  if(pinBuf.length>=4) return;
  pinBuf += n; 
  if(pinBuf.length===4){
    setTimeout(()=>{
      if(S.vaultPin===null){
        if(pinFirst===null){ pinFirst=pinBuf; pinBuf=''; render(); return; }
        if(pinFirst===pinBuf){ S.vaultPin=pinBuf; save(); pinBuf=''; pinFirst=null; vaultOpen=true; go('vaultlist'); toast('Your vault is set up and open.'); }
        else { toast('Those did not match. Start again.'); pinFirst=null; pinBuf=''; render(); }
        return;
      }
      if(pinBuf===S.vaultPin){ pinBuf=''; vaultOpen=true; go('vaultlist'); }
      else { toast('That is not the right PIN.'); pinBuf=''; render(); }
    }, 120);
  } else render();
}

    ${HOLY_BOOKS.map(b=>`<button class="opt-card ${(!S.user.holyBookCustom && S.user.holyBook===b)?'on':''}" onclick="S.user.holyBook='${b.replace(/'/g,"\\'")}';S.user.holyBookCustom='';save();closeModal();render()"><span class="material-symbols-outlined">menu_book</span>${b}</button>`).join('')}
    <label class="field-label" style="margin-top:10px">A different one?</label>
    <input id="book-custom" placeholder="Name it…" value="${esc(S.user.holyBookCustom||'')}">
    <button class="grad-btn" style="margin-top:14px" onclick="S.user.holyBookCustom=document.getElementById('book-custom').value.trim();save();closeModal();render()">Save</button>`);
}
function toggleCalm(){ S.calm=!S.calm; save(); render(); toast(S.calm?'Calm mode on. Animations are off.':'Calm mode off.'); }

    <h2 style="font-size:20px;font-weight:700;margin-bottom:6px">Your Selah Book</h2>

    <div class="glass" style="border-radius:16px;padding:16px;max-height:44dvh;overflow-y:auto;font-size:13px;line-height:1.7;color:rgba(255,255,255,.85)">
      <b style="font-size:15px">The Selah Book of ${esc(S.user.soulName)}</b><br>

      <div style="margin-top:14px"><b class="accent-t" style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Moments (${S.moments.length})</b></div>

      <div style="margin-top:14px"><b class="accent-t" style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Victories (${wins.length})</b></div>

function signOut(){
  if(!confirmAsk('Sign out? Your writing stays safe for when you come back.')) return;
  if(window.BK && BK.on) BK.signOut();
  S.auth=null; save(); authStage='enter'; authContact=''; route='home'; render();
}


/* ================= BACKEND (Supabase + Gemini edge function) ================= */
const BK = {
  on:false, sb:null, session:null, _pushT:null, _pulseAt:0,
  friendly(e, fallback){
    const m = (e && (e.message || e.error_description || e.msg)) || '';
    if(/rate limit/i.test(m)) return 'Too many tries in a row. Give it a minute, then try again.';
    if(/expired/i.test(m)) return 'That code expired. Request a fresh one.';
    if(/invalid/i.test(m)) return 'That code does not match. Check it and try again.';
    if(/sms|phone|twilio|messagebird|vonage/i.test(m)) return 'Phone sign in is not switched on yet in the backend. Use email for now.';
    return m || fallback;
  },
  normPhone(v){
    const d = v.replace(/[^\d+]/g,'');
    if(d.startsWith('+')) return d;
    const digits = d.replace(/\D/g,'');
    return digits.length===10 ? '+1'+digits : '+'+digits;
  },
  async init(){
    try{
      const cfg = window.SELAH_CONFIG || {};
      if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || /PASTE_/.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY) || !window.supabase) return;
      this.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      this.on = true;
      const { data:{ session } } = await this.sb.auth.getSession();
      this.session = session;
      this.sb.auth.onAuthStateChange((_e, s)=>{ this.session = s; });
      if(session){
        if(!S.auth){
          S.auth = {method:'session', contact: session.user.email || session.user.phone || 'you', at:new Date().toISOString()};
        }
        await this.pullState();
        store.set(S);
      } else if(S.auth){
        S.auth = null; store.set(S);
      }
    }catch(e){ console.warn('Backend init failed; running local.', e); }
  },
  async sendOtp(method, contact){
    if(method==='email'){
      const { error } = await this.sb.auth.signInWithOtp({ email: contact, options:{ shouldCreateUser:true, emailRedirectTo: window.location.origin + window.location.pathname } });
      if(error) throw error;
    } else {
      const { error } = await this.sb.auth.signInWithOtp({ phone: this.normPhone(contact) });
      if(error) throw error;
    }
  },
  async verifyOtp(method, contact, token){
    const args = method==='email'
      ? { email: contact, token, type:'email' }
      : { phone: this.normPhone(contact), token, type:'sms' };
    const { data, error } = await this.sb.auth.verifyOtp(args);
    if(error) throw error;
    this.session = data.session;
  },
  exportState(){ const {auth, ...rest} = S; return rest; },
  schedulePush(){
    clearTimeout(this._pushT);
    this._pushT = setTimeout(()=>this.pushState(), 1200);
  },
  async pushState(){
    if(!this.session) return;
    try{
      await this.sb.from('soul_state').upsert({
        user_id: this.session.user.id, state: this.exportState(), updated_at: new Date().toISOString()
      });
    }catch(e){ console.warn('Sync failed (kept locally).', e); }
  },
  async pullState(){
    if(!this.session) return;
    try{
      const { data, error } = await this.sb.from('soul_state').select('state').eq('user_id', this.session.user.id).maybeSingle();
      if(error) throw error;
      if(data && data.state && data.state.onboarded){
        const keepAuth = S.auth;
        S = Object.assign({}, S, data.state);
        S.auth = keepAuth;
      }
    }catch(e){ console.warn('Could not pull remote state; using local.', e); }
  },
  async pushPulse(post){
    if(!this.session) return;
    try{
      await this.sb.from('pulse_posts').insert({
        id: post.id, user_id: this.session.user.id, name: post.name,
        where_label: post.where, cat: post.cat, kind: post.kind, text_body: post.text
      });
    }catch(e){ console.warn('Share failed; kept locally.', e); }
  },
  async actOnPulse(id){
    if(!this.session) return;
    try{
      const p = S.pulse.find(x=>x.id===id);
      await this.sb.from('pulse_posts').update({ acts: (p?p.acts:0) }).eq('id', id);
    }catch(e){}
  },
  async maybeRefreshPulse(){
    if(!this.session || Date.now()-this._pulseAt < 30000) return;
    this._pulseAt = Date.now();
    try{
      const { data, error } = await this.sb.from('pulse_posts').select('*').order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      if(data){
        const remote = data.map(r=>({id:r.id, name:r.name, where:r.where_label||'Somewhere out there', cat:r.cat, kind:r.kind, text:r.text_body, acts:r.acts||0}));
        const seeds = SEED_PULSE.filter(sp=>!remote.some(r=>r.id===sp.id));
        S.pulse = remote.concat(seeds);
        store.set(S);
        if(route==='pulse') render();
      }
    }catch(e){ console.warn('Feed refresh failed.', e); }
  },
  async discern(J){
    const packet = {
      entry_type: J.type, text: J.text, emotion: J.emotion,
      lang: S.lang || 'en', photo: J.photo || null,
      clairs: J.clairs.map(c=>({ key:c, label:giftLabel(c) })),
      symbols: J.symbols.map(k=>({ key:k, name:SYMBOLS[k].name, meaning:SYMBOLS[k].meaning })),
      user: {
        name: S.user.soulName, lens: lensLabel(S.user.lens), lenses: (S.user.lenses||[S.user.lens]).map(lensLabel),
        custom_lens: S.user.customLens||null, divine_name: S.user.divineName,
        divine_names: divineList(), divine_pronouns: pronounList(),
        divine_pronoun: S.user.divinePronoun||'none',
        holy_book: userBook(),
        season: S.user.season ? seasonLabel(S.user.season) : null,
        gifts: (S.user.gifts||[]).map(g=>giftLabel(g)), comfort: S.user.comfort,
        relational_style: S.user.relational, processing_style: S.user.processing,
        vocabulary: { insight_word: T('discernNoun'), petition_word: T('petitionOne') }
      }
    };
    const { data, error } = await this.sb.functions.invoke('discern', { body: packet });
    if(error) throw error;
    if(!data || !data.reflection) throw new Error('Empty discernment');
    return { reflection: data.reflection, questions: Array.isArray(data.questions) ? data.questions.slice(0,3) : [] };
  },
  signOut(){ try{ this.sb.auth.signOut(); }catch(e){} this.session=null; }
};
window.BK = BK;
async function bootApp(){
  try{ if(typeof BK!=='undefined') await BK.init(); }catch(e){}
  render();
}

/* ================= BOOT ================= */
/* Icons are ligature text under the hood ("visibility", "hearing"...). If the icon
   font has not rendered yet, showing them would print those raw words — so icons
   stay hidden until the font is confirmed, and stay hidden (never gibberish) if
   the font cannot load at all. */
(function(){
  const ready = ()=>document.body.classList.add('icons-ready');
  const hasFont = ()=>{
    try{
      let face = false;
      document.fonts.forEach(f=>{ if(/Material Symbols Outlined/i.test(f.family)) face = true; });
      return face && document.fonts.check('24px "Material Symbols Outlined"');
    }catch(e){ return false; }
  };
  if(!(document.fonts && document.fonts.load)){ ready(); return; }
  try{ document.fonts.load('24px "Material Symbols Outlined"').then(()=>{ if(hasFont()) ready(); }); }catch(e){}
  let tries = 0;
  const t = setInterval(()=>{ tries++; if(hasFont()){ ready(); clearInterval(t); } else if(tries > 24){ clearInterval(t); } }, 500);
})();
bootApp();
</script>
